<!DOCTYPE html>
<html lang="ja"
<head>
  <meta charset="UTF-8">
  <title>トーナメント表 - STANDARD部門</title>
  <style>
    /* 1920x1080の画面にピッタリ合わせる設定 */
    html, body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden; /* スクロールバーを非表示 */
      background-color: #ffffff;
    }

    /* iframeを画面いっぱいに広げる */
    .iframe-container {
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none; /* 枠線を消す */
    }
  </style>
</head>
<body>

  <div class="iframe-container">
    <!-- いただいた埋め込みタグをそのまま使用 -->
    <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSJ9mquQm_J8GBgOq2Qj_aHNJGLbCZTgIU4uK_GH0bjRSYwHbQ6xKLyATkmaTeNX3_6pqzy7XmHmowm/pubhtml?gid=0&amp;single=true&amp;widget=true&amp;headers=false"></iframe>
  </div>

</body>
</html>
